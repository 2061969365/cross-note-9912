name: Build CrossNote

# Avoid concurrent runs on the same branch — newer push cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions pinned to major versions (@v4/@v5) for stability; SHA pinning deferred.
# setup-java@v5 and subosito/flutter-action cache:true are intentionally kept.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      - run: npm --prefix apps/server ci
      - run: npm --prefix apps/server run build
      - run: node apps/server/dist/index.js &
        env:
          PORT: 8787
      - run: for i in {1..10}; do curl -sf http://localhost:8787/api/health && break || sleep 1; done; node test_local.mjs

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: cd apps/client && flutter pub get
      - run: cd apps/client && flutter analyze
      - run: cd apps/client && flutter build web
      - uses: actions/upload-artifact@v4
        with:
          name: crossnote-web
          path: apps/client/build/web
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: cd apps/client && flutter pub get
      - run: cd apps/client && flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: crossnote-windows
          path: apps/client/build/windows/x64/runner/Release
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: cd apps/client && flutter pub get
      - run: cd apps/client && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: crossnote-android-apk
          path: apps/client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
