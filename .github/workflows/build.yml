name: Build CrossNote

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # 后端冒烟（REST + WS 全量联调）
  server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      - run: npm --prefix apps/server ci
      - run: npm --prefix apps/server run build
      - run: node apps/server/dist/index.js &
      - run: sleep 3 && node test_local.mjs

  # Web 已在本地验证过，这里云端再出一份
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: cd apps/client && flutter pub get
      - run: cd apps/client && flutter analyze
      - run: cd apps/client && flutter build web
      - uses: actions/upload-artifact@v4
        with:
          name: crossnote-web
          path: apps/client/build/web
          if-no-files-found: error

  # Windows 桌面版 — 需要 Visual Studio，云端 windows-latest 自带
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: cd apps/client && flutter pub get
      - run: cd apps/client && flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: crossnote-windows
          path: apps/client/build/windows/x64/runner/Release
          if-no-files-found: error

  # Android APK — 本机其实也能打（你已有 Android SDK 35），云端也打一份
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: cd apps/client && flutter pub get
      - run: cd apps/client && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: crossnote-android-apk
          path: apps/client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
