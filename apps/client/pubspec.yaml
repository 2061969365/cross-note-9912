name: cross_note_client
description: Cross-platform realtime sync notes — offline-first. Android/Web/Windows via one Flutter codebase.
publish_to: "none"
version: 0.1.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
  # Flutter version kept as caret for flexibility; pin to exact version in CI (flutter-action) when reproducibility requires it.
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.0
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.24
  drift_flutter: ^0.2.4
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  web_socket_channel: ^3.0.2
  http: ^1.2.2
  intl: ^0.20.1
  flutter_markdown: ^0.7.6+1
  collection: ^1.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.13
  drift_dev: ^2.22.0

flutter:
  uses-material-design: true
