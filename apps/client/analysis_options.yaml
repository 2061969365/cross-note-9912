analyzer:
  exclude:
    - build/**
    - web/**
    - windows/**
    - android/**
  errors:
    # use_build_context_synchronously surfaced as warning; do not suppress globally.
    use_build_context_synchronously: warning
    # prefer_interpolation_to_compose_strings is NOT suppressed globally;
    # use per-line `// ignore: prefer_interpolation_to_compose_strings` where justified.
include: package:flutter_lints/flutter.yaml
linter:
  rules:
    - avoid_print: false
